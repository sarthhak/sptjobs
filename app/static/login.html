<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics Expert</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page" style="max-width:380px;margin-top:12vh">
    <div class="card">
      <h1>Analytics Expert</h1>
      <form method="post" action="/login" class="row" style="flex-direction:column;align-items:stretch">
        <label for="pw">Password</label>
        <input id="pw" type="password" name="password" autofocus required>
        <p id="err" class="sev-high" style="display:none;margin:0">Wrong password.</p>
        <button class="primary" type="submit">Log in</button>
      </form>
    </div>
  </div>
  <script>if (location.search.includes("error")) document.getElementById("err").style.display = "block";</script>
</body>
</html>
